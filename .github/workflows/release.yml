name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            name: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            name: macos-x64
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            name: linux
          - platform: windows-latest
            args: ""
            rust_targets: ""
            name: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross-compilation targets (macOS)
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Aperio ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Downloads
            | Platform | Artifacts |
            |----------|-----------|
            | macOS (Apple Silicon) | `.dmg`, `.app.tar.gz` (aarch64) |
            | macOS (Intel) | `.dmg`, `.app.tar.gz` (x64) |
            | Windows | `.msi` / setup `.exe` |
            | Linux | `.AppImage`, `.deb` |

            ### macOS Gatekeeper
            Unsigned builds may show **"App is damaged"**. Prefer the `.app.tar.gz` over the `.dmg`, or run:
            `xattr -cr /Applications/Aperio.app`
            See [README — macOS Installation Note](https://github.com/${{ github.repository }}#-macos-installation-note-gatekeeper).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package macOS app bundle (.app.tar.gz)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target -path '*/release/bundle/macos/Aperio.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Aperio.app not found under src-tauri/target/**/release/bundle/macos/"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="Aperio_${VERSION}_${{ matrix.name }}.app.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload macOS .app.tar.gz to release
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ARCHIVE_PATH" --clobber
